
<!DOCTYPE html>
<html>
<head>
    <title>Pesquisa de opinião</title>
</head>
<body>

    <h2>Pesquisa de opinião</h2>

    <label>Nome:</label>
    <input type="text" id="nome">

    <br><br>

    <label>Idade:</label>
    <input type="number" id="idade">

    <br><br>

    <label>Sexo:</label>
    <select id="sexo">
        <option value="M">Masculino</option>
        <option value="F">Feminino</option>
    </select>

    <br><br>

    <label>Opinião:</label>
    <select id="opiniao">
        <option value="1">Péssimo</option>
        <option value="2">Regular</option>
        <option value="3">Bom</option>
        <option value="4">Ótimo</option>
    </select>

    <br><br>

    <button onclick="responder()">Enviar resposta</button>

    <p id="contador"></p>
    <div id="resultado"></div>

    <script src="ex8.js"></script>

</body>
</html>
